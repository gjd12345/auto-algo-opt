<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptBench · 组合优化研究工作台 (20261127-main-co-workbench-m6-final)</title>
<style>
:root {
  --bg-canvas: #f5f7fa;
  --bg-surface: #ffffff;
  --bg-plot: #fafbfc;
  --bg-subtle: #f0f2f5;
  --paper-warm: #faf9f6;
  --surface-warm: #fffefa;
  --border-warm: #ddded4;
  --ink: #1d2129;
  --ink-sec: #4e5969;
  --ink-muted: #86909c;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --brand: #165dff;
  --brand-soft: #eff4ff;
  --teal: #0f766e;
  --teal-soft: #eef7f6;
  --terra: #c2410c;
  --terra-soft: #fdf2ee;
  --slate-ref: #94a3b8;
  --font-sans: "PingFang SC", "Microsoft YaHei", "HarmonyOS Sans SC", system-ui, -apple-system, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body.presentation-mode { font-size: 15.5px; }
body.presentation-mode .main { max-width: 1440px; }

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.serif { font-family: var(--font-serif); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--ink-muted); }
.sec { color: var(--ink-sec); }

/* Single 52px Sticky Header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  min-height: 52px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1320px;
  min-height: 52px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.seg {
  display: inline-flex;
  background: var(--bg-subtle);
  padding: 2px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--ink-sec);
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  padding: 4px 11px;
  border-radius: 4px;
  cursor: pointer;
}
.seg button.active {
  background: var(--bg-surface);
  color: var(--brand);
  font-weight: 600;
}
.nav-tabs {
  display: flex;
  align-items: center;
  gap: 24px;
  min-height: 52px;
}
.nav-link {
  position: relative;
  min-height: 52px;
  border: 0;
  background: transparent;
  color: var(--ink-sec);
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 500;
  padding: 0 2px;
  cursor: pointer;
  white-space: nowrap;
}
.nav-link:hover { color: var(--ink); }
.nav-link.active { color: var(--brand); font-weight: 600; }
.nav-link.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--brand);
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.release-tag {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-muted);
  white-space: nowrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:enabled { border-color: var(--brand); color: var(--brand); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.active, .btn.primary {
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand);
  font-weight: 600;
}
.btn.link { border: 0; background: transparent; color: var(--brand); padding: 4px 6px; }
.btn.link:hover { text-decoration: underline; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

select, input[type="search"], input[type="text"] {
  font-family: var(--font-sans);
  font-size: 12.5px;
  color: var(--ink);
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 5px 10px;
}
select:focus, input[type="search"]:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--brand);
}

.main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px 24px 64px;
}

/* L0 Canvas Header */
.overview-header {
  text-align: center;
  padding: 12px 0 32px;
}
.overview-header h1 {
  margin: 0 0 10px;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.overview-header .subtitle {
  margin: 0 0 20px;
  font-size: 14.5px;
  color: var(--ink-sec);
}
.fact-strip {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 13.5px;
  color: var(--ink-sec);
}
.fact-item {
  padding: 0 20px;
  border-right: 1px solid var(--border-strong);
}
.fact-item:last-child { border-right: 0; }
.fact-item b { color: var(--ink); font-weight: 600; }

/* Surfaces & Hairline Tables */
.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px 26px;
  margin-bottom: 18px;
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.panel-title {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
}
.panel-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--ink-muted);
}

.controls-inline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--ink-sec);
  cursor: pointer;
  user-select: none;
}
.toggle-label input { accent-color: var(--brand); cursor: pointer; }

.jargon-tip {
  border-bottom: 1px dotted var(--ink-muted);
  cursor: help;
}

.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.num { text-align: right; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--brand); }
tbody td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr.active-row td { background: #fafbfc; font-weight: 600; }
.matrix-table tbody tr { cursor: pointer; }
.matrix-table tbody tr:hover td { background: #fafbfc; }
td.cell-best {
  background: var(--brand-soft) !important;
  color: var(--brand);
  font-weight: 600;
}
.cell-click { cursor: pointer; }
.cell-click:hover { text-decoration: underline; }
.cell-sub {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-muted);
  margin-top: 1px;
}
.row-title { font-weight: 500; color: var(--ink); }
.row-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

/* Overview 3-Family Visual Strip */
.cover-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 960px) { .cover-grid { grid-template-columns: 1fr; } }
.cover-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.cover-head {
  padding: 15px 18px 12px;
}
.cover-code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--brand);
  margin-bottom: 3px;
}
.cover-head h3 {
  margin: 0 0 4px;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
}
.cover-head p {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-muted);
}
.cover-plot {
  background: var(--bg-plot);
  border-block: 1px solid var(--border);
  height: 128px;
  display: grid;
  place-items: center;
  padding: 6px 10px;
}
.cover-links {
  list-style: none;
  margin: 0;
  padding: 8px 18px 12px;
}
.cover-links li a, .cover-links li button {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.cover-links li:last-child a, .cover-links li:last-child button { border-bottom: 0; }
.cover-links li a:hover, .cover-links li button:hover { color: var(--brand); }

/* Subtabs (Text Underline) */
.subnav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.subnav-btn {
  position: relative;
  border: 0;
  background: transparent;
  padding: 10px 2px;
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-sec);
  cursor: pointer;
}
.subnav-btn:hover { color: var(--ink); }
.subnav-btn.active { color: var(--brand); font-weight: 600; }
.subnav-btn.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--brand);
}

.status-tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 11.5px;
  font-family: var(--font-mono);
  background: var(--bg-subtle);
  color: var(--ink-sec);
}
.status-tag.good { background: var(--teal-soft); color: var(--teal); }
.status-tag.warn { background: var(--terra-soft); color: var(--terra); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

.summary-bar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
@media (max-width: 820px) { .summary-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.summary-item .k { font-size: 12px; color: var(--ink-muted); }
.summary-item .v { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.summary-item .s { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

/* Comparator 66% / 34% Split */
.cmp-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.cmp-split {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 1040px) { .cmp-split { grid-template-columns: 1fr; } }
.canvas-panel, .inspector-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px;
}
.dual-plots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 780px) { .dual-plots { grid-template-columns: 1fr; } }
.plot-title { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 2px; }
.plot-sub { font-size: 12px; color: var(--ink-muted); margin: 0 0 8px; }
.plot-box {
  background: var(--bg-plot);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.scrubber-bar {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scrubber-bar input[type="range"] { width: 100%; accent-color: var(--brand); cursor: pointer; }
.scrubber-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-sec);
}
.kpi-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.kpi-row:first-child { padding-top: 2px; }
.kpi-row:last-child { border-bottom: 0; }
.kpi-k { font-size: 13px; color: var(--ink-sec); }
.kpi-v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--ink); }
.kpi-v.good { color: var(--teal); }
.kpi-v.warn { color: var(--terra); }
.route-mini-table td, .route-mini-table th { padding: 7px 6px; font-size: 12px; }
.route-mini-row { cursor: pointer; }
.route-mini-row.active td { background: var(--brand-soft); }
.load-bar {
  display: inline-block;
  width: 54px;
  height: 5px;
  background: var(--bg-subtle);
  border-radius: 99px;
  overflow: hidden;
  vertical-align: middle;
  margin-right: 6px;
}
.load-fill { display: block; height: 100%; background: var(--teal); }
.diag-note {
  margin-top: 14px;
  padding: 11px 13px;
  background: var(--bg-plot);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--ink-sec);
  line-height: 1.6;
}

/* L3 Warm-Paper Editorial Reading Stream & KB Reader */
.editorial-col {
  max-width: 840px;
  margin: 0 auto;
  background: var(--surface-warm);
  border: 1px solid var(--border-warm);
  border-radius: 8px;
  padding: 28px 36px;
  line-height: 1.72;
}
.crumb-line { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; }
.formula-center {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--ink);
  padding: 16px 14px;
  margin: 10px 0 16px;
  background: var(--paper-warm);
  border: 1px solid var(--border-warm);
  border-radius: 6px;
}
.microlab-frame {
  border: 1px solid var(--border-warm);
  border-radius: 8px;
  padding: 18px 20px;
  margin: 18px 0 24px;
  background: var(--bg-surface);
}
.microlab-frame input[type="range"] { width: 100%; accent-color: var(--brand); cursor: pointer; }
.rank-bar-track { height: 4px; background: var(--bg-subtle); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.rank-bar-fill { height: 100%; background: var(--brand); }
.blueprint-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
@media (max-width: 720px) { .blueprint-grid { grid-template-columns: 1fr; } }
.blueprint-box {
  background: var(--bg-plot);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
}
.blueprint-box h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
.blueprint-box ul { margin: 0; padding-left: 16px; color: var(--ink-sec); }

.kb-grid {
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 900px) { .kb-grid { grid-template-columns: 1fr; } }
.kb-list-panel {
  max-height: 700px;
  overflow-y: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.kb-list-item {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.kb-list-item:last-child { border-bottom: 0; }
.kb-list-item:hover { background: var(--bg-plot); }
.kb-list-item.active { background: var(--brand-soft); }
.kb-list-title { font-size: 13px; font-weight: 500; color: var(--ink); }
.kb-list-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }

details.source-box {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  background: var(--bg-plot);
  font-size: 13px;
  color: var(--ink-sec);
  margin-top: 12px;
}
details.source-box summary, details > summary {
  cursor: pointer;
  font-weight: 500;
  color: var(--ink);
}
pre.md-pre {
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--bg-plot);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  overflow-x: auto;
}

</style>
</head>

  function esc(val) {

  function fmtPct(ratio, digits) {

  function fmtRatioAsPctPlain(ratio, digits) {

  }

  function fmtValPct(pctVal, digits) {
    if (pctVal === null || pctVal === undefined || !Number.isFinite(Number(pctVal))) return "—";

  }

  function fmtNum(val, digits) {
    if (val === null || val === undefined || !Number.isFinite(Number(val))) return "—";

  }

  function fmtObj(val) {

  }

  function fmtMs(val) {
    if (val === null || val === undefined || !Number.isFinite(Number(val))) return "—";

    return n >= 100 ? n.toFixed(1) + " ms" : n.toFixed(2) + " ms";
  }

  function suiteTitle(suiteOrId) {
    const sid = typeof suiteOrId === "string" ? suiteOrId : (suiteOrId && suiteOrId.suite_id) || "";
    return SUITE_DISPLAY[sid] || (suiteOrId && suiteOrId.metadata && suiteOrId.metadata.title) || sid;
  }

  function algTitle(core, algId) {
    const a = getAlg(core, algId);
    return ALG_DISPLAY[algId] || (a && a.display_name) || algId;
  }

  function getSuite(core, suiteId) {
    return (core && core.suites || []).find((s) => s.suite_id === suiteId) || null;
  }

  function getAlg(core, algId) {
    return (core && core.algorithms || []).find((a) => a.algorithm_id === algId) || null;
  }

  function kbMap(core) {
    const m = {};
    (core && core.kb_entries || []).forEach((e) => { if (e && e.id) m[e.id] = e; });
    return m;
  }

  function resolveAlgKbId(core, algId) {
    const a = getAlg(core, algId);
    const map = kbMap(core);
    return (a && a.kb_entry_id && map[a.kb_entry_id]) ? a.kb_entry_id : "";

  function getAlgMechanism(core, algId) {
    const kbId = resolveAlgKbId(core, algId);
    const entry = kbId ? kbMap(core)[kbId] : null;
    if (entry && entry.attributes && entry.attributes.interface_blueprint && entry.attributes.interface_blueprint.skeleton_role) {
      return entry.attributes.interface_blueprint.skeleton_role;
    }
    if (entry && entry.summary) return entry.summary;
    const a = getAlg(core, algId);
    return (a && a.description) || "—";
  }

  function jargon(key, label) {
    return '<span class="jargon-tip" title="' + esc(JARGON_GLOSS[key] || "") + '">' + esc(label || key) + "</span>";

  function getSuiteSummary(core, suiteId) {
    return (core && core.summary && core.summary.suites && core.summary.suites[suiteId]) || null;
  }

  function hasPartialCompletion(suiteSum) {
    return Boolean(
      suiteSum &&
      suiteSum.common_completed_count &&
      suiteSum.n_instances &&
      suiteSum.common_completed_count < suiteSum.n_instances
    );
  }

  function resolveScope(suiteSum, requestedScope) {
    if (requestedScope === "overall") return "overall";
    if (requestedScope === "common_completed") {
      return (suiteSum && suiteSum.common_completed_count) ? "common_completed" : "overall";
    }
    return hasPartialCompletion(suiteSum) ? "common_completed" : "overall";
  }

  function getAlgStats(suiteSum, algId, scope) {
    if (!suiteSum || !suiteSum.algorithms || !suiteSum.algorithms[algId]) return null;
    const a = suiteSum.algorithms[algId];
    if (scope === "common_completed" && a.common_completed) return a.common_completed;
    if (scope === "strict_all_common_completed" && a.strict_all_common_completed) return a.strict_all_common_completed;
    return a.overall || null;
  }

  function computeHeroSnapshot(core) {
    const suites = (core && core.suites) || [];
    const kbEntries = (core && core.kb_entries) || [];
    const pub = (core && core.published_results) || {};
    const orGoldIds = ["cvrp_ext_cvrplib_abp_74", "cvrp_ext_cvrplib_x_100", "tsp_ext_tsplib_euc2d"];
    const orGoldInstances = suites
      .filter((s) => orGoldIds.includes(s.suite_id))
      .reduce((acc, s) => acc + Number(s.instance_count || 0), 0);

    const hp = (core && core.h003_preview) || null;
    const p0 = getSuiteSummary(core, "cvrp_hist_p0_120");
    const setX = getSuiteSummary(core, "cvrp_ext_cvrplib_x_100");
    const eohs256 = getSuiteSummary(core, "cvrp_ext_eohs_256");
    const fa120 = getSuiteSummary(core, "cvrp_final_accept_120");

    const analyses = (core && core.selection && core.selection.analyses) || {};
    const h288 = analyses.hetero_288__pointwise_plus_s2 || null;
    const faSel = analyses.final_accept_120__pointwise_plus_s2_frozen || null;
    const faProtoKey = faSel && faSel.protocols ? Object.keys(faSel.protocols)[0] : null;
    const stressRecs = (core && core.scale_stress && core.scale_stress.records) || [];

    function maxDrift(aid) {
      const rows = stressRecs.filter((r) => r.algorithm_id === aid && Number.isFinite(Number(r.scale_drift_pct)));
      return rows.length ? Math.max.apply(null, rows.map((r) => Math.abs(Number(r.scale_drift_pct)))) : null;
    }

    return {
      suiteCount: suites.length,
      algorithmCount: (core && core.algorithms || []).length,
      kbCount: kbEntries.length,
      sourcesCount: Number((core && core.sources_count) || 0),
      orGoldInstances: orGoldInstances,
      pubVerifiedCount: Number(pub.verified_count || 0),
      pubPendingCount: Number(pub.pending_count || 0),
      h003Summary: hp && hp.summary ? hp.summary : null,
      h003DepotOnly: hp && hp.depot_only ? hp.depot_only : null,
      r5P0: getAlgStats(p0, "s2_r5_spiral", "overall"),
      ctrlP0: getAlgStats(p0, "s2_ctrl_best", "overall"),
      nnP0: getAlgStats(p0, "nn", "overall"),
      setX: setX,
      xCommonN: setX ? Number(setX.common_completed_count || 0) : 0,
      r5XAll: getAlgStats(setX, "s2_r5_spiral", "overall"),
      r5XCommon: getAlgStats(setX, "s2_r5_spiral", "common_completed"),
      eohsF1XAll: getAlgStats(setX, "eohs_cvrp_f1", "overall"),
      eohsF1XCommon: getAlgStats(setX, "eohs_cvrp_f1", "common_completed"),
      cwRelXCommon: getAlgStats(setX, "cw_relocate_2opt", "common_completed"),
      cwRelXAll: getAlgStats(setX, "cw_relocate_2opt", "overall"),
      eohs256Cpi: getAlgStats(eohs256, "eohs_cvrp_set10_cpi", "overall"),
      cwRelFa: getAlgStats(fa120, "cw_relocate_2opt", "overall"),
      hxFa: getAlgStats(fa120, "heuragenix_min_cost_ins", "overall"),
      r5Fa: getAlgStats(fa120, "s2_r5_spiral", "overall"),
      h288: h288,
      h288Cv12: h288 && h288.protocols && h288.protocols.cv12 && h288.protocols.cv12.selectors ? h288.protocols.cv12.selectors.rf_reg : null,
      h288Loso3: h288 && h288.protocols && h288.protocols.loso3 && h288.protocols.loso3.selectors ? h288.protocols.loso3.selectors.rf_reg : null,
      faSel: faSel,
      faSelRf: (faProtoKey && faSel.protocols[faProtoKey].selectors) ? faSel.protocols[faProtoKey].selectors.rf_reg : null,
      driftC: maxDrift("c"),
      driftV0: maxDrift("v0"),
      driftR5: maxDrift("s2_r5_spiral")
    };
  }

  window.WB_LABELS = {

    esc: esc,
    fmtPct: fmtPct,
    fmtRatioAsPctPlain: fmtRatioAsPctPlain,
    fmtValPct: fmtValPct,
    fmtNum: fmtNum,
    fmtObj: fmtObj,
    fmtMs: fmtMs,
    suiteTitle: suiteTitle,
    algTitle: algTitle,
    getSuite: getSuite,
    getAlg: getAlg,
    kbMap: kbMap,

/* === exporters.js === */
/* Publication-grade asset exporters: SVG, 300 DPI PNG, LaTeX booktabs .tex, CSV, JSON.
 * 100% client-side offline export using exact release data.
 */
(function () {
  "use strict";

  function triggerDownload(filename, mimeType, content) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  function serializeSvg(svgEl) {
    if (!svgEl) return null;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    const vb = clone.getAttribute("viewBox");
    let w = Number(clone.getAttribute("width")) || 0;
    let h = Number(clone.getAttribute("height")) || 0;
    if ((!w || !h) && vb) {
      const parts = vb.trim().split(/[\s,]+/).map(Number);
      if (parts.length === 4) {
        w = parts[2];
        h = parts[3];
      }
    }
    if (!w) w = svgEl.clientWidth || 720;
    if (!h) h = svgEl.clientHeight || 420;
    clone.setAttribute("width", String(w));
    clone.setAttribute("height", String(h));
    return {
      xml: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone),
      width: w,
      height: h
    };
  }

  function exportSvg(svgEl, filename) {
    const res = serializeSvg(svgEl);
    if (!res) return false;
    triggerDownload(filename || "figure.svg", "image/svg+xml;charset=utf-8", res.xml);
    return true;
  }

  function exportPng300Dpi(svgEl, filename) {
    const res = serializeSvg(svgEl);
    if (!res) return false;
    const scale = 300 / 96; // 3.125x rasterization for 300 DPI print clarity
    const img = new Image();
    const svgBlob = new Blob([res.xml], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);
    img.onload = function () {
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(res.width * scale);
      canvas.height = Math.round(res.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fffefa";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (pngBlob) {
        if (pngBlob) triggerDownload(filename || "figure_300dpi.png", "image/png", pngBlob);
      }, "image/png");
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
    };
    img.src = url;
    return true;
  }

  function latexEscape(text) {
    return String(text || "")
      .replace(/\\/g, "\\textbackslash{}")
      .replace(/([_%&#${}])/g, "\\$1");
  }

  function generateLatexLocalTable(core, suiteId, scope) {
    const L = window.WB_LABELS;
    const suite = L.getSuite(core, suiteId);
    const sum = L.getSuiteSummary(core, suiteId);
    if (!suite || !sum) return "% Suite summary unavailable";

    const effScope = L.resolveScope(sum, scope);
    const useCommon = effScope === "common_completed" && sum.common_completed_count;
    const commonN = sum.common_completed_count || suite.instance_count;
    const rows = Object.keys(sum.algorithms || {}).map(function (aid) {
      const stats = L.getAlgStats(sum, aid, effScope);
      return { aid: aid, stats: stats, allStats: L.getAlgStats(sum, aid, "overall") };
    }).filter(function (r) { return Boolean(r.stats); });

    rows.sort(function (a, b) {
      const ga = a.stats.mean_rel_gap !== null && a.stats.mean_rel_gap !== undefined ? a.stats.mean_rel_gap : 999;
      const gb = b.stats.mean_rel_gap !== null && b.stats.mean_rel_gap !== undefined ? b.stats.mean_rel_gap : 999;
      return ga - gb;
    });

    const scopeDesc = useCommon
      ? ("Common completed intersection $N_{\\text{common}}=" + commonN + "$ / " + suite.instance_count)
      : ("Per-algorithm completed samples (out of $N=" + suite.instance_count + "$)");

    const lines = [
      "% Auto-generated by CO-Workbench (" + (core.release_id || "") + ") — local_recomputed track ONLY",
      "\\begin{table}[t]",
      "  \\centering",
      "  \\caption{" + latexEscape(L.suiteTitle(suite)) + " (\\texttt{" + latexEscape(suiteId) + "}, " + scopeDesc + ", Budget " + (sum.budget_ms || 500) + "\\,ms)}",
      "  \\begin{tabular}{llrrrr}",
      "    \\toprule",
      "    Algorithm & Paradigm & ok/$N$ & Mean Obj. & Mean Gap (\\%) & $P_{50}/P_{95}$ Solve (ms) \\\\",
      "    \\midrule"
    ];

    rows.forEach(function (r) {
      const a = L.getAlg(core, r.aid);
      const st = r.stats;
      const allSt = r.allStats || st;
      const okStr = allSt.ok_count + "/" + allSt.n_instances;
      const objStr = st.mean_tour_length !== null && st.mean_tour_length !== undefined ? Number(st.mean_tour_length).toFixed(4) : "--";
      const gapStr = st.mean_rel_gap !== null && st.mean_rel_gap !== undefined ? (Number(st.mean_rel_gap) * 100).toFixed(2) + "\\%" : "--";
      const msStr = (st.solve_ms_p50 !== null && st.solve_ms_p50 !== undefined ? Number(st.solve_ms_p50).toFixed(2) : "--") +
        " / " + (st.solve_ms_p95 !== null && st.solve_ms_p95 !== undefined ? Number(st.solve_ms_p95).toFixed(2) : "--");
      lines.push(
        "    \\texttt{" + latexEscape(r.aid) + "} & " +
        latexEscape((a && a.paradigm) || "") + " & " +
        okStr + " & " + objStr + " & " + gapStr + " & " + msStr + " \\\\"
      );
    });

    lines.push(
      "    \\bottomrule",
      "  \\end{tabular}",
      "  \\vspace{2pt}",
      "  \\footnotesize{\\emph{Notes:} Mode=\\texttt{local\\_recomputed}; Ref=\\texttt{" + latexEscape(sum.reference_kind || "") + "}; Dist=\\texttt{" + latexEscape(sum.distance_convention || "") + "}. Separate from paper-reported tables.}",
      "\\end{table}"
    );
    return lines.join("\n");
  }

  function exportCsv(rows, columns, filename) {
    if (!rows || !rows.length) return false;
    const header = columns.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    const body = rows.map(function (r) {
      return columns.map(function (c) {
        const v = r[c];
        if (v === null || v === undefined) return "";
        return '"' + String(v).replace(/"/g, '""') + '"';
      }).join(",");
    }).join("\n");
    triggerDownload(filename || "records.csv", "text/csv;charset=utf-8", "\uFEFF" + header + "\n" + body);
    return true;
  }

  function exportJson(payload, filename) {
    triggerDownload(filename || "records.json", "application/json;charset=utf-8", JSON.stringify(payload, null, 2));
    return true;
  }

  window.WB_EXPORT = {
    exportSvg: exportSvg,
    exportPng300Dpi: exportPng300Dpi,
    generateLatexLocalTable: generateLatexLocalTable,
    exportCsv: exportCsv,
    exportJson: exportJson,
    downloadText: function (filename, text) {
      triggerDownload(filename, "text/plain;charset=utf-8", text);
    }
  };
})();

  function dist2d(a, b) {
    return Math.hypot(a[0] - b[0], a[1] - b[1]);
  }

  function renderH003Body(core, alpha, L) {
    const hp = core.h003_preview;
    const inst = hp.instances.find(function (x) { return x.id === hp.example; }) || hp.instances[0];
    const depot = inst.coords[0];
    const all = [];
    for (let j = 1; j < inst.coords.length; j++) {
      const dj = dist2d(depot, inst.coords[j]);
      all.push({ j: j, d0: dj, score: (1 - alpha) * dj, q: inst.demands[j], coord: inst.coords[j] });
    }
    all.sort(function (a, b) { return a.score - b.score; });
    const top5 = all.slice(0, 5);
    const maxS = Math.max(1e-6, Math.max.apply(null, top5.map(function (c) { return Math.abs(c.score); })));

      return '<line x1="' + sx(depot[0]).toFixed(1) + '" y1="' + sy(depot[1]).toFixed(1) + '" x2="' + sx(c.coord[0]).toFixed(1) + '" y2="' + sy(c.coord[1]).toFixed(1) + '" stroke="' + lineCol + '" stroke-width="1.8" stroke-dasharray="4,3"/>';

      return '<circle cx="' + sx(p[0]).toFixed(1) + '" cy="' + sy(p[1]).toFixed(1) + '" r="' + (isPick ? 4.5 : 2.3) + '" fill="' + (isPick ? lineCol : "#94a3b8") + '" opacity="' + (isPick ? "0.95" : "0.5") + '"/>';

      '<div class="grid-2"><div class="plot-box"><svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="235"><rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fafbfc"/>' + lines + dots + "</svg></div><div>" + bars + "</div></div>";
  }

  function renderH001Body(core, scaleVal, L) {

    const order = ["c", "eohs_cvrp_f1", "v0", "s2_r5_spiral", "s2_r7_iso", "nn", "cw_relocate_2opt"];
    return order.filter(function (id) { return byAlg[id] !== undefined; }).map(function (aid) {

      const closed = rawT[0] === rawT[rawT.length - 1] ? rawT : rawT.concat([rawT[0]]);
      const ptsAttr = closed.map(function (i) {
        return bounds.pts[i] ? (sx(bounds.pts[i][0]).toFixed(1) + "," + sy(bounds.pts[i][1]).toFixed(1)) : "";
      }).filter(Boolean).join(" ");
      layers.push('<polyline fill="none" stroke="' + primaryColor + '" stroke-width="1.9" points="' + ptsAttr + '"/>');
      focalRoute = closed;
    } else {
      const targetIdx = (highlightIdx >= 0 && highlightIdx < routeData.routes.length) ? highlightIdx : 0;
      focalRoute = normCvrpRoute(routeData.routes[targetIdx]);
      // Draw non-focal routes first (dimmed when focusing or when a specific route row is selected)
      routeData.routes.forEach(function (r, rIdx) {
        if (rIdx === targetIdx) return;
        const nr = normCvrpRoute(r);
        const ptsAttr = nr.map(function (i) { return bounds.pts[i] ? (sx(bounds.pts[i][0]).toFixed(1) + "," + sy(bounds.pts[i][1]).toFixed(1)) : ""; }).filter(Boolean).join(" ");
        const op = (highlightIdx >= 0 || focusOnly) ? "0.22" : "0.78";
        const wd = (highlightIdx >= 0 || focusOnly) ? "1.05" : "1.55";
        layers.push('<polyline fill="none" stroke="' + primaryColor + '" stroke-opacity="' + op + '" stroke-width="' + wd + '" points="' + ptsAttr + '"/>');
      });
      // Focal route on top
      const fAttr = focalRoute.map(function (i) { return bounds.pts[i] ? (sx(bounds.pts[i][0]).toFixed(1) + "," + sy(bounds.pts[i][1]).toFixed(1)) : ""; }).filter(Boolean).join(" ");
      layers.push('<polyline fill="none" stroke="' + primaryColor + '" stroke-width="2.2" points="' + fAttr + '"/>');
    }

    // Active step replay overlay (preserving chronological partial decisions & voluntary returns)
    let activeStepBadge = null;
    if (traceUpTo && traceUpTo.steps && traceUpTo.steps.length) {
      traceUpTo.steps.forEach(function (st) {
        const p1 = bounds.pts[st.current_node], p2 = bounds.pts[st.next_node];
        if (!p1 || !p2) return;
        const isVol = st.action_type === "voluntary_early_return";
        layers.push('<line x1="' + sx(p1[0]).toFixed(1) + '" y1="' + sy(p1[1]).toFixed(1) + '" x2="' + sx(p2[0]).toFixed(1) + '" y2="' + sy(p2[1]).toFixed(1) + '" stroke="' + (isVol ? "#c2410c" : "#165dff") + '" stroke-width="' + (isVol ? "2.6" : "2.1") + '"' + (isVol ? ' stroke-dasharray="5,3"' : "") + "/>");
      });
      const last = traceUpTo.steps[traceUpTo.steps.length - 1];
      activeStepBadge = last;
      const curP = bounds.pts[last.next_node];
      if (curP) {
        layers.push('<circle cx="' + sx(curP[0]).toFixed(1) + '" cy="' + sy(curP[1]).toFixed(1) + '" r="6" fill="none" stroke="' + (last.action_type === "voluntary_early_return" ? "#c2410c" : "#165dff") + '" stroke-width="2.2"/>');
      }
    }

    // Customer & depot nodes
    const focalSet = {};
    if (focalRoute) focalRoute.forEach(function (n) { focalSet[n] = true; });
    const smallDot = bounds.pts.length > 140;
    const nodes = bounds.pts.map(function (p, idx) {
      const cx = sx(p[0]), cy = sy(p[1]);
      if (family === "cvrp" && idx === 0) {
        return '<rect x="' + (cx - 4.5).toFixed(1) + '" y="' + (cy - 4.5).toFixed(1) + '" width="9" height="9" fill="#1d2129" transform="rotate(45 ' + cx.toFixed(1) + " " + cy.toFixed(1) + ')"/>';
      }
      const inFocal = Boolean(focalSet[idx]);
      return '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (inFocal ? (smallDot ? 2.1 : 2.6) : (smallDot ? 1.2 : 1.7)) + '" fill="#ffffff" stroke="' + (inFocal ? primaryColor : "#86909c") + '" stroke-width="' + (inFocal ? "1.3" : "0.8") + '"/>';
    }).join("");

    // Departure arrow & anti-overlap first-visit badge (adopted from showcase visual polish)
    let arrowSvg = "";
    if (family === "cvrp" && focalRoute && focalRoute.length >= 2 && bounds.pts[0] && bounds.pts[focalRoute[1]]) {
      const dPt = bounds.pts[0], fPt = bounds.pts[focalRoute[1]];
      const x0 = sx(dPt[0]), y0 = sy(dPt[1]), x1 = sx(fPt[0]), y1 = sy(fPt[1]);
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const mx = x0 + 0.58 * (x1 - x0), my = y0 + 0.58 * (y1 - y0);
      const tri = [[6.5, ang], [6.5, ang + 2.52], [6.5, ang - 2.52]].map(function ( pair) {
        return (mx + pair[0] * Math.cos(pair[1])).toFixed(1) + "," + (my + pair[0] * Math.sin(pair[1])).toFixed(1);
      }).join(" ");
      arrowSvg += '<polygon points="' + tri + '" fill="' + primaryColor + '"/>';
      arrowSvg += '<circle cx="' + x1.toFixed(1) + '" cy="' + y1.toFixed(1) + '" r="4.2" fill="' + primaryColor + '" stroke="#ffffff" stroke-width="1.3"/>';
      if (!smallDot || focusOnly) {
        const alignLeft = x1 > x0;
        const label = activeStepBadge && activeStepBadge.action_type === "voluntary_early_return"
          ? "早返"
          : ("#" + String(focalRoute[1]).padStart(2, "0"));
        arrowSvg += '<text x="' + (x1 + (alignLeft ? -7 : 7)).toFixed(1) + '" y="' + (y1 + 4).toFixed(1) + '" text-anchor="' + (alignLeft ? "end" : "start") + '" font-size="11" font-weight="600" fill="' + primaryColor + '" stroke="#fafbfc" stroke-width="3" paint-order="stroke">' + L.esc(label) + "</text>";
      }
    }

    return '<svg id="' + L.esc(svgId) + '" viewBox="0 0 ' + W + " " + H + '" width="100%" height="365">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fafbfc" rx="6"/>' +
      grid.join("") + layers.join("") + nodes + arrowSvg + "</svg>";
  }

  function drawObpSvg(svgId, routeData, inst, primaryColor, L) {
    const W = 480, H = 300, pad = 32;
    const fills = (routeData && routeData.sample_bin_fills) || [];
    if (!fills.length) return '<div class="muted" style="padding:20px;">无箱位填充记录</div>';
    const show = fills.slice(0, 32);
    const bw = (W - pad * 2) / show.length;
    const bars = show.map(function (f, i) {
      const ratio = Math.max(0, Math.min(1, Number(f)));
      const bh = ratio * (H - pad * 2 - 20);
      const x = pad + i * bw + 1.5, y = H - pad - bh;
      const col = ratio >= 0.9 ? primaryColor : ratio >= 0.7 ? "#64748b" : "#c2410c";
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(2, bw - 3).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + col + '"/>';
    }).join("");
    return '<svg id="' + L.esc(svgId) + '" viewBox="0 0 ' + W + " " + H + '" width="100%" height="285">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fafbfc" rx="6"/>' +
      '<line x1="' + pad + '" y1="' + (pad + 18) + '" x2="' + (W - pad) + '" y2="' + (pad + 18) + '" stroke="#94a3b8" stroke-dasharray="4,3"/>' +
      '<text x="' + (W - pad) + '" y="' + (pad + 13) + '" font-size="10.5" fill="#4e5969" text-anchor="end">容量 100% (C=' + L.esc(inst.capacity) + ")</text>" +
      bars + "</svg>";
  }

  function pickPresetInstance(suiteBundle, algA, algB, presetKind) {
    const recs = (suiteBundle && suiteBundle.records) || [];
    const byA = {}, byB = {};
    recs.forEach(function (r) {
      if (r.algorithm_id === algA) byA[r.instance_id] = r;
      if (r.algorithm_id === algB) byB[r.instance_id] = r;
    });
    const pairs = Object.keys(byA).filter(function (id) { return byB[id]; }).map(function (id) { return { id: id, a: byA[id], b: byB[id] }; });
    if (!pairs.length) return null;
    if (presetKind === "early_return") {
      pairs.sort(function (x, y) { return Number(y.a.voluntary_early_return_count || 0) - Number(x.a.voluntary_early_return_count || 0); });
      if (Number(pairs[0].a.voluntary_early_return_count || 0) > 0) return pairs[0].id;
      const alt = recs.filter(function (r) { return Number(r.voluntary_early_return_count || 0) > 0; })
        .sort(function (x, y) { return Number(y.voluntary_early_return_count) - Number(x.voluntary_early_return_count); });
      if (alt.length) return alt[0].instance_id;
    }
    if (presetKind === "worst_loss") {
      const toPair = pairs.find(function (p) { return p.a.status !== "ok" || p.b.status !== "ok"; });
      if (toPair) return toPair.id;
      pairs.sort(function (x, y) { return (Number(y.a.rel_gap || 0) - Number(y.b.rel_gap || 0)) - (Number(x.a.rel_gap || 0) - Number(x.b.rel_gap || 0)); });
      return pairs[0].id;
    }
    const okPairs = pairs.filter(function (p) { return p.a.status === "ok" && p.b.status === "ok" && p.a.rel_gap !== null && p.b.rel_gap !== null; });
    const pool = okPairs.length ? okPairs : pairs;
    pool.sort(function (x, y) { return (Number(x.a.rel_gap || 0) - Number(x.b.rel_gap || 0)) - (Number(y.a.rel_gap || 0) - Number(y.b.rel_gap || 0)); });
    return pool[0].id;
  }

  function render(core, state, suiteBundle) {
    const L = window.WB_LABELS;
    const fam = state.family || "cvrp";
    const famSuites = (core.suites || []).filter(function (s) { return s.problem_family === fam; });
    const activeSuite = L.getSuite(core, state.suite) || famSuites[0] || core.suites[0];
    const suiteId = activeSuite.suite_id;

    if (!suiteBundle || !suiteBundle.suite || suiteBundle.suite.suite_id !== suiteId) {
      return '<div class="panel">正在载入测试集 <code>' + L.esc(suiteId) + "</code> 算例坐标与路径…</div>";
    }

    const algs = activeSuite.algorithms_evaluated || [];
    const algA = (state.algA && algs.includes(state.algA)) ? state.algA : (algs.includes("s2_r5_spiral") ? "s2_r5_spiral" : algs[0]);
    let algB = (state.algB && algs.includes(state.algB)) ? state.algB : (algs.includes("cw_relocate_2opt") ? "cw_relocate_2opt" : (algs[1] || algs[0]));
    if (algA === algB && algs.length > 1) algB = algs.find(function (x) { return x !== algA; }) || algA;

    const instances = suiteBundle.suite.instances || [];
    let instId = state.inst;
    if (!instId || !instances.some(function (x) { return x.instance_id === instId; })) {
      instId = pickPresetInstance(suiteBundle, algA, algB, state.preset || "best_gain") || (instances[0] && instances[0].instance_id);
    }
    const instObj = instances.find(function (x) { return x.instance_id === instId; }) || instances[0];
    const instRoutes = (suiteBundle.routes && suiteBundle.routes.routes_by_instance && suiteBundle.routes.routes_by_instance[instId]) || {};
    const routeA = instRoutes[algA] || null, routeB = instRoutes[algB] || null;
    const optOverlay = state.showOpt ? (fam === "tsp" ? instRoutes.__opt__ : (instRoutes.__bks__ || (instObj.bks_routes ? { routes: instObj.bks_routes } : null))) : null;

    const recA = (suiteBundle.records || []).find(function (r) { return r.instance_id === instId && r.algorithm_id === algA; }) || null;
    const recB = (suiteBundle.records || []).find(function (r) { return r.instance_id === instId && r.algorithm_id === algB; }) || null;

    const tracesByInst = (suiteBundle.traces && suiteBundle.traces.traces_by_instance && suiteBundle.traces.traces_by_instance[instId]) || {};
    const traceAlg = tracesByInst[algA] ? algA : (tracesByInst[algB] ? algB : null);
    const traceSteps = traceAlg ? tracesByInst[traceAlg] : null;
    let stepIdx = state.stepIdx !== undefined && state.stepIdx !== null ? Number(state.stepIdx) : -1;
    if (traceSteps && stepIdx < 0 && state.preset === "early_return") {
      const firstVol = traceSteps.findIndex(function (s) { return s.action_type === "voluntary_early_return"; });
      if (firstVol >= 0) stepIdx = firstVol;
    }
    if (traceSteps && stepIdx >= traceSteps.length) stepIdx = traceSteps.length - 1;
    const activeSlice = (traceSteps && stepIdx >= 0) ? { alg: traceAlg, steps: traceSteps.slice(0, stepIdx + 1) } : null;
    const focusOnly = state.cmpFocus !== "all";
    const hi = state.hlRoute !== undefined && state.hlRoute !== null ? Number(state.hlRoute) : -1;

    let canvasInner = "";
    if (fam === "obp") {
      canvasInner = '<div class="dual-plots">' +
        '  <div><div class="plot-title">' + L.esc(L.algTitle(core, algA)) + '</div><div class="plot-sub">箱容 C=' + L.esc(instObj.capacity) + '</div><div class="plot-box">' + drawObpSvg("cmp-svg-a", routeA, instObj, "#0f766e", L) + "</div></div>" +
        '  <div><div class="plot-title">' + L.esc(L.algTitle(core, algB)) + '</div><div class="plot-sub">箱容 C=' + L.esc(instObj.capacity) + '</div><div class="plot-box">' + drawObpSvg("cmp-svg-b", routeB, instObj, "#c2410c", L) + "</div></div>" +
        "</div>";
    } else {
      const bounds = computeSharedBounds(instObj, fam);
      canvasInner = '<div class="dual-plots">' +
        '  <div><div class="plot-title">' + L.esc(L.algTitle(core, algA)) + '</div><div class="plot-sub">' + (recA && recA.status === "ok" ? (L.fmtObj(recA.tour_length) + " · " + L.fmtPct(recA.rel_gap, 2)) : "未完成/超时") + '</div><div class="plot-box">' + drawSpatialSvg("cmp-svg-a", instObj, fam, routeA, recA, "#0f766e", bounds, optOverlay, hi, focusOnly, traceAlg === algA ? activeSlice : null, L) + "</div></div>" +
        '  <div><div class="plot-title">' + L.esc(L.algTitle(core, algB)) + '</div><div class="plot-sub">' + (recB && recB.status === "ok" ? (L.fmtObj(recB.tour_length) + " · " + L.fmtPct(recB.rel_gap, 2)) : "未完成/超时") + '</div><div class="plot-box">' + drawSpatialSvg("cmp-svg-b", instObj, fam, routeB, recB, "#c2410c", bounds, optOverlay, hi, focusOnly, traceAlg === algB ? activeSlice : null, L) + "</div></div>" +
        "</div>";
    }

    let scrubberHtml = "";
    if (traceSteps && traceSteps.length) {
      const curSt = stepIdx >= 0 ? traceSteps[stepIdx] : null;
      const volCount = traceSteps.filter(function (s) { return s.action_type === "voluntary_early_return"; }).length;
      const statusInfo = curSt
        ? ("第 " + (stepIdx + 1) + "/" + traceSteps.length + " 步 · Route #" + (curSt.route_idx + 1) + " (" + curSt.current_node + " → " + curSt.next_node + ") · Q=" + curSt.rest_capacity_before + "→" + curSt.rest_capacity_after + (curSt.action_type === "voluntary_early_return" ? " · 触发主动早返" : ""))
        : ("轨迹总步数 " + traceSteps.length + "（含 " + volCount + " 次主动早返，拖动或点击跳转查看）");
      scrubberHtml = '<div class="scrubber-bar">' +
        '  <input id="cmp-step-slider" type="range" min="-1" max="' + (traceSteps.length - 1) + '" step="1" value="' + stepIdx + '"/>' +
        '  <div class="scrubber-controls">' +
        '    <div class="controls-inline">' +
        '      <button class="btn sm" id="cmp-step-reset">总览</button>' +
        '      <button class="btn sm" id="cmp-step-prev">上一步</button>' +
        '      <button class="btn sm" id="cmp-step-next">下一步</button>' +
        '      <button class="btn sm active" id="cmp-step-next-vol">跳至主动早返 (' + volCount + ")</button>" +
        "    </div>" +
        '    <span class="mono">' + L.esc(statusInfo) + "</span>" +
        "  </div>" +
        "</div>";
    }

    // Inspector right card (3 KPIs + compact clickable route load table + concise diagnostic note)
    let diffCls = "";
    let gapTxt = "—";
    if (recA && recB && recA.status === "ok" && recB.status === "ok" && recB.tour_length) {
      const d = (recA.tour_length - recB.tour_length) / recB.tour_length;
      diffCls = d < -1e-6 ? "good" : d > 1e-6 ? "warn" : "";
      gapTxt = L.fmtPct(recA.rel_gap, 2) + " vs " + L.fmtPct(recB.rel_gap, 2);
    }

    let routeMiniHtml = "";
    if (fam === "cvrp" && routeA && routeA.routes && routeA.routes.length) {
      const cap = Number(instObj.capacity || 1), loads = routeA.route_loads || [], dists = routeA.route_distances || [];
      const rows = routeA.routes.slice(0, 10).map(function (r, rIdx) {
        const ld = loads[rIdx] !== undefined ? loads[rIdx] : 0;
        const pct = Math.min(100, (ld / cap) * 100);
        const active = hi === rIdx ? " active" : "";
        return '<tr class="route-mini-row' + active + '" data-hl-route="' + (hi === rIdx ? -1 : rIdx) + '">' +
          '<td class="mono">#' + (rIdx + 1) + "</td>" +
          '<td><span class="load-bar"><span class="load-fill" style="width:' + pct.toFixed(0) + '%;"></span></span><span class="mono">' + ld + "/" + cap + "</span></td>" +
          '<td class="num">' + (dists[rIdx] !== undefined ? L.fmtNum(dists[rIdx], 2) : "—") + "</td>" +
          "</tr>";
      }).join("");
      routeMiniHtml = '<h3 style="font-size:13.5px;font-weight:600;margin:16px 0 8px;">Algorithm A 路线负荷（点击高亮）</h3>' +
        '<div class="table-wrap"><table class="route-mini-table"><thead><tr><th>车次</th><th>载重 / Q</th><th class="num">路程</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
        (routeA.routes.length > 10 ? ('<div class="muted" style="font-size:11.5px;margin-top:6px;">仅列前 10 条（共 ' + routeA.routes.length + " 条）</div>") : "");
    }

    let diagText = "同一实例输入下的双算法结构对照；图内箭头标示焦距路径的仓口出发首跳。";
    if ((recA && recA.status !== "ok") || (recB && recB.status !== "ok")) {
      diagText = "存在预算耗时上限截断（A: " + (recA ? recA.status : "—") + " / B: " + (recB ? recB.status : "—") + "），如实呈现未完成边界。";
    } else if (fam === "cvrp" && recA && recB) {
      const vrA = recA.voluntary_early_return_count || 0, vrB = recB.voluntary_early_return_count || 0;
      diagText = "路线数 A=" + (recA.route_count || "—") + " vs B=" + (recB.route_count || "—") + "，主动早返 A=" + vrA + " 次 / B=" + vrB + " 次；可叠加官方 BKS (" + L.fmtObj(instObj.reference_objective) + ") 检查尾部绕行。";
    }

    const kbA = L.resolveAlgKbId(core, algA), kbB = L.resolveAlgKbId(core, algB);

    return [
      '<div class="cmp-bar">',
      '  <div class="controls-inline">',
      '    <select id="cmp-suite-sel">' + core.suites.map(function (s) { return '<option value="' + L.esc(s.suite_id) + '"' + (s.suite_id === suiteId ? " selected" : "") + ">" + L.esc(L.suiteTitle(s)) + "</option>"; }).join("") + "</select>",
      '    <select id="cmp-inst-sel">' + instances.slice(0, 150).map(function (x) { return '<option value="' + L.esc(x.instance_id) + '"' + (x.instance_id === instId ? " selected" : "") + ">" + L.esc(x.instance_id) + " (n=" + x.size + ")</option>"; }).join("") + "</select>",
      '    <select id="cmp-alg-a">' + algs.map(function (id) { return '<option value="' + L.esc(id) + '"' + (id === algA ? " selected" : "") + ">A: " + L.esc(L.algTitle(core, id)) + "</option>"; }).join("") + "</select>",
      '    <select id="cmp-alg-b">' + algs.map(function (id) { return '<option value="' + L.esc(id) + '"' + (id === algB ? " selected" : "") + ">B: " + L.esc(L.algTitle(core, id)) + "</option>"; }).join("") + "</select>",
      "  </div>",
      '  <div class="controls-inline">',
      '    <button class="btn sm" id="cmp-preset-gain">改善例</button>',
      '    <button class="btn sm" id="cmp-preset-loss">边界/超时例</button>',
      fam === "cvrp" ? '<button class="btn sm" id="cmp-preset-early">早返例</button>' : "",
      fam !== "obp" ? ('<label class="toggle-label"><input type="checkbox" id="cmp-focus-ck"' + (focusOnly ? " checked" : "") + "/> 重点路线聚焦</label>") : "",
      fam !== "obp" ? ('<label class="toggle-label"><input type="checkbox" id="cmp-opt-overlay"' + (state.showOpt ? " checked" : "") + "/> 叠加官方参考</label>") : "",
      "  </div>",
      "</div>",

      '<div class="cmp-split">',
      '  <div class="canvas-panel">',
      canvasInner,
      scrubberHtml,
      "  </div>",
      '  <aside class="inspector-card">',
      '    <div class="panel-head" style="margin-bottom:8px;"><h3 class="panel-title">算例检验指标</h3><div class="controls-inline"><button class="btn link sm" id="cmp-export-svg-a">SVG</button><button class="btn link sm" id="cmp-export-png-a">PNG</button></div></div>',
      '    <div class="kpi-row"><span class="kpi-k">目标长度 (A / B)</span><span class="kpi-v ' + diffCls + '">' + (recA && recA.status === "ok" ? L.fmtObj(recA.tour_length) : "超时") + " vs " + (recB && recB.status === "ok" ? L.fmtObj(recB.tour_length) : "超时") + "</span></div>",
      '    <div class="kpi-row"><span class="kpi-k">相对参考差距</span><span class="kpi-v">' + L.esc(gapTxt) + "</span></div>",
      '    <div class="kpi-row"><span class="kpi-k">求解耗时</span><span class="kpi-v">' + (recA ? L.fmtMs(recA.solve_ms) : "—") + " vs " + (recB ? L.fmtMs(recB.solve_ms) : "—") + "</span></div>",
      routeMiniHtml,
      '    <div class="diag-note">' + L.esc(diagText) + "</div>",
      (kbA || kbB) ? ('<div class="controls-inline" style="margin-top:12px;">' + (kbA ? '<button class="btn sm" data-nav="page=knowledge&tab=library&entry=' + L.esc(kbA) + '">A 知识卡</button>' : "") + (kbB ? '<button class="btn sm" data-nav="page=knowledge&tab=library&entry=' + L.esc(kbB) + '">B 知识卡</button>' : "") + "</div>") : "",
      "  </aside>",
      "</div>"
    ].join("\n");
  }

  function bind(rootEl, core, state, nav, suiteBundle) {
    const L = window.WB_LABELS;
    const sSel = rootEl.querySelector("#cmp-suite-sel");
    if (sSel) sSel.addEventListener("change", function () {
      const s = L.getSuite(core, sSel.value);
      nav({ suite: sSel.value, family: (s && s.problem_family) || state.family, inst: "", stepIdx: -1, hlRoute: -1 });

    const bSel = rootEl.querySelector("#cmp-alg-b");
    if (bSel) bSel.addEventListener("change", function () { nav({ algB: bSel.value, stepIdx: -1 }); });

    const algs = (L.getSuite(core, state.suite) || {}).algorithms_evaluated || [];
    const curA = (state.algA && algs.includes(state.algA)) ? state.algA : (algs.includes("s2_r5_spiral") ? "s2_r5_spiral" : algs[0]);
    const curB = (state.algB && algs.includes(state.algB)) ? state.algB : (algs.includes("cw_relocate_2opt") ? "cw_relocate_2opt" : (algs[1] || algs[0]));

    const lBtn = rootEl.querySelector("#cmp-preset-loss");

    const eBtn = rootEl.querySelector("#cmp-preset-early");
    if (eBtn) eBtn.addEventListener("click", function () {

      const trInst = (suiteBundle && suiteBundle.traces && suiteBundle.traces.traces_by_instance && suiteBundle.traces.traces_by_instance[targetId]) || {};
      const tList = trInst[curA] || trInst.s2_r5_spiral || null;
      const firstVol = Array.isArray(tList) ? tList.findIndex(function (s) { return s.action_type === "voluntary_early_return"; }) : -1;
      nav({ inst: targetId, preset: "early_return", stepIdx: firstVol >= 0 ? firstVol : -1, hlRoute: -1 });
    });

    const fCk = rootEl.querySelector("#cmp-focus-ck");
    if (fCk) fCk.addEventListener("change", function () { nav({ cmpFocus: fCk.checked ? "focus" : "all" }); });
    const optCk = rootEl.querySelector("#cmp-opt-overlay");
    if (optCk) optCk.addEventListener("change", function () { nav({ showOpt: optCk.checked }); });
    rootEl.querySelectorAll("[data-hl-route]").forEach(function (el) {
      el.addEventListener("click", function () { nav({ hlRoute: Number(el.getAttribute("data-hl-route")) }); });
    });

    const instId = state.inst || ((suiteBundle && suiteBundle.suite && suiteBundle.suite.instances[0] && suiteBundle.suite.instances[0].instance_id) || "");
    const tMap = (suiteBundle && suiteBundle.traces && suiteBundle.traces.traces_by_instance && suiteBundle.traces.traces_by_instance[instId]) || {};
    const tAlg = tMap[curA] ? curA : (tMap[curB] ? curB : null);

    const slider = rootEl.querySelector("#cmp-step-slider");

    const pBtn = rootEl.querySelector("#cmp-step-prev");
    if (pBtn && steps) pBtn.addEventListener("click", function () { nav({ stepIdx: Math.max(-1, curIdx - 1) }); });
    const nBtn = rootEl.querySelector("#cmp-step-next");
    if (nBtn && steps) nBtn.addEventListener("click", function () { nav({ stepIdx: Math.min(steps.length - 1, curIdx + 1) }); });
    const vBtn = rootEl.querySelector("#cmp-step-next-vol");
    if (vBtn && steps) {
      vBtn.addEventListener("click", function () {
        let nxt = steps.findIndex(function (s, idx) { return idx > curIdx && s.action_type === "voluntary_early_return"; });
        if (nxt < 0) nxt = steps.findIndex(function (s) { return s.action_type === "voluntary_early_return"; });
        if (nxt >= 0) nav({ stepIdx: nxt });

    const svgBtn = rootEl.querySelector("#cmp-export-svg-a");

  }

  window.WB_VIEWS = window.WB_VIEWS || {};

})();


/* === results_view.js === */
/* Shared Results Sub-Renderers: Pareto SVG, Tier Breakdown, Published Tables, Selection Panel. */
(function () {
  "use strict";

  function renderParetoSvg(core, suiteId, scope, L) {
    const sum = L.getSuiteSummary(core, suiteId);
    if (!sum || !sum.algorithms) return '<div class="muted">暂无数据</div>';
    const pts = Object.keys(sum.algorithms).map(function (aid, i) {
      const st = L.getAlgStats(sum, aid, scope);
      const ov = L.getAlgStats(sum, aid, "overall");
      if (!st || st.mean_rel_gap === null || st.solve_ms_p50 === null) return null;
      return {
        aid: aid,
        label: L.algTitle(core, aid),
        gapPct: Number(st.mean_rel_gap) * 100,
        ms: Math.max(0.05, Number(st.solve_ms_p50)),
        color: L.PALETTE[i % L.PALETTE.length],
        ok: ov ? ov.ok_count : 0,
        n: ov ? ov.n_instances : 0
      };
    }).filter(Boolean);
    if (!pts.length) return '<div class="muted">暂无可绘图点</div>';

    const sortedByMs = pts.slice().sort(function (a, b) { return a.ms - b.ms; });
    const frontier = [];
    let bestGap = Infinity;
    sortedByMs.forEach(function (p) {
      if (p.gapPct < bestGap) { bestGap = p.gapPct; frontier.push(p); }
    });

    const W = 780, H = 360, pl = 68, pr = 40, pt = 28, pb = 50;
    const minLog = Math.log10(Math.min.apply(null, pts.map(function (p) { return p.ms; })));
    const maxLog = Math.log10(Math.max.apply(null, pts.map(function (p) { return p.ms; })));
    const spanLog = Math.max(0.5, maxLog - minLog);
    const gaps = pts.map(function (p) { return p.gapPct; });
    const minG = Math.min.apply(null, gaps), maxG = Math.max.apply(null, gaps);
    const padG = Math.max(1.5, (maxG - minG) * 0.12);
    const gLo = minG - padG, gHi = maxG + padG;

    const sx = function (ms) { return pl + ((Math.log10(ms) - minLog) / spanLog) * (W - pl - pr); };
    const sy = function (g) { return H - pb - ((g - gLo) / Math.max(1e-6, gHi - gLo)) * (H - pt - pb); };

    const grid = [];
    for (let i = 0; i <= 4; i++) {
      const yg = gLo + ((gHi - gLo) * i) / 4;
      const y = sy(yg);
      grid.push('<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '" stroke="#e5e7eb"/>');
      grid.push('<text x="' + (pl - 8) + '" y="' + (y + 4).toFixed(1) + '" font-size="11" fill="#86909c" text-anchor="end">' + yg.toFixed(1) + "%</text>");
    }
    [0.1, 1, 10, 100, 500].forEach(function (tickMs) {
      const l = Math.log10(tickMs);
      if (l >= minLog - 0.12 && l <= maxLog + 0.12) {
        const x = Math.max(pl, Math.min(W - pr, sx(tickMs)));
        grid.push('<line x1="' + x.toFixed(1) + '" y1="' + pt + '" x2="' + x.toFixed(1) + '" y2="' + (H - pb) + '" stroke="#e5e7eb"/>');
        grid.push('<text x="' + x.toFixed(1) + '" y="' + (H - pb + 18) + '" font-size="11" fill="#86909c" text-anchor="middle">' + tickMs + "ms</text>");
      }
    });

    const fPath = frontier.length > 1
      ? '<polyline fill="none" stroke="#165dff" stroke-width="1.8" stroke-dasharray="4,3" points="' + frontier.map(function (p) { return sx(p.ms).toFixed(1) + "," + sy(p.gapPct).toFixed(1); }).join(" ") + '"/>'
      : "";

    const circles = pts.map(function (p) {
      const cx = sx(p.ms), cy = sy(p.gapPct), isF = frontier.indexOf(p) >= 0;
      return '<g style="cursor:pointer;" data-nav="page=comparator&suite=' + L.esc(suiteId) + "&algA=" + L.esc(p.aid) + '">' +
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (isF ? 6 : 4.5) + '" fill="' + (isF ? "#165dff" : "#94a3b8") + '" stroke="#fff" stroke-width="1.5"/>' +
        '<text x="' + (cx + 8).toFixed(1) + '" y="' + (cy + 3.5).toFixed(1) + '" font-size="11.5" font-weight="' + (isF ? "600" : "400") + '" fill="#1d2129">' + L.esc(p.label) + " (" + p.gapPct.toFixed(1) + "%)</text>" +
        "</g>";
    }).join("");

    return '<svg id="pareto-svg" viewBox="0 0 ' + W + " " + H + '" width="100%" height="360">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fafbfc" rx="6"/>' +
      grid.join("") +
      '<line x1="' + pl + '" y1="' + (H - pb) + '" x2="' + (W - pr) + '" y2="' + (H - pb) + '" stroke="#cbd5e1"/>' +
      '<line x1="' + pl + '" y1="' + pt + '" x2="' + pl + '" y2="' + (H - pb) + '" stroke="#cbd5e1"/>' +
      '<text x="' + ((pl + W - pr) / 2) + '" y="' + (H - 12) + '" font-size="12" fill="#4e5969" text-anchor="middle">求解耗时中位数 P50 (ms，对数刻度)</text>' +
      '<text x="18" y="' + ((pt + H - pb) / 2) + '" font-size="12" fill="#4e5969" text-anchor="middle" transform="rotate(-90 18 ' + ((pt + H - pb) / 2) + ')">相对差距 % Gap (越低越优)</text>' +
      fPath + circles + "</svg>";
  }

  function renderTierBreakdown(core, suiteId, sum, L) {
    if (!sum || !sum.algorithms) return "";
    const algs = Object.keys(sum.algorithms);
    let bucketField = "by_scale", title = "多规模分档质量对照";
    if (suiteId === "cvrp_ext_cvrplib_x_100") {
      bucketField = "by_x_tier";
      title = "Set X 三档规模分组（X-S 100–250 / X-M 251–500 / X-L 501–1000）";
    } else if (suiteId === "cvrp_ext_cvrplib_abp_74") {
      bucketField = "by_cvrplib_set";
      title = "CVRPLib 子集 A / B / P 分组对照";
    } else if (suiteId.indexOf("obp_") === 0) {
      bucketField = "by_obp_regime";
      title = "OBP 容量与流长分组对照";
    }

    const keysSet = {};
    algs.forEach(function (aid) {
      const m = sum.algorithms[aid][bucketField];
      if (m) Object.keys(m).forEach(function (k) { keysSet[k] = true; });
    });
    const tierKeys = Object.keys(keysSet);
    if (!tierKeys.length) return "";

    const bodyRows = algs.map(function (aid) {
      const m = sum.algorithms[aid][bucketField] || {};
      const cells = tierKeys.map(function (tk) {
        const st = m[tk];
        if (!st) return '<td class="num muted">—</td>';
        const okNote = st.ok_count < st.n_instances ? (' <span class="muted">(' + st.ok_count + "/" + st.n_instances + ")</span>") : "";
        return '<td class="num">' + L.fmtPct(st.mean_rel_gap, 2) + okNote + "</td>";
      }).join("");
      return '<tr><td><div class="row-title">' + L.esc(L.algTitle(core, aid)) + '</div><div class="row-sub mono">' + L.esc(aid) + "</div></td>" + cells + "</tr>";
    }).join("");

    return '<div class="panel"><div class="panel-head"><h3 class="panel-title">' + L.esc(title) + '</h3></div>' +
      '<div class="table-wrap"><table><thead><tr><th>算法</th>' + tierKeys.map(function (k) { return '<th class="num">' + L.esc(k) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + bodyRows + "</tbody></table></div></div>";
  }

  function renderPublishedTrack(core, suite, fam, showAllPapers, L) {

      "  </div>" +

    const mistakeRows = mistakes.slice(0, 30).map(function (d) {

        '<td class="num" style="color:var(--terra);">' + L.fmtPct(d.regret_rel, 2) + "</td>" +
        '<td><button class="btn link sm" data-nav="page=comparator&suite=' + L.esc(analysis.suite_id) + "&inst=" + L.esc(d.instance_id) + "&algA=" + L.esc(d.selected_algorithm) + "&algB=" + L.esc(d.oracle_algorithm) + '">路线对照</button></td>' +

      '  <div class="summary-item"><div class="k">理论 ' + L.jargon("VBS", "Oracle VBS") + '</div><div class="v">' + L.fmtNum(analysis.global_vbs_total, 2) + '</div><div class="s">样本数 N=' + analysis.n_instances + "</div></div>" +
      '  <div class="summary-item"><div class="k">池内互补间隙</div><div class="v">' + L.fmtRatioAsPctPlain(analysis.global_sbs_gap_to_vbs, 2) + '</div><div class="s">候选数 ' + (analysis.members || []).length + "</div></div>" +
      '  <div class="summary-item"><div class="k">失误例 (' + L.esc(decKey || "") + ')</div><div class="v">' + mistakes.length + "/" + decisions.length + '</div><div class="s">相对事后最优遗憾</div></div>' +
      "</div>" +
      '<div class="panel">' +
      '  <div class="panel-head">' +
      '    <div><h2 class="panel-title">实例级算法选择评估</h2><p class="panel-sub">严格分离特征提取、推理与求解三段耗时，区分同分布交叉验证与独立迁移泛化边界</p></div>' +
      '    <div class="controls-inline">' +
      '      <select id="l2-sel-analysis">' + keys.map(function (k) { return '<option value="' + L.esc(k) + '"' + (k === selKey ? " selected" : "") + ">" + L.esc(k) + " (" + L.esc(analyses[k].evaluation_mode) + ")</option>"; }).join("") + "</select>" +
      '      <select id="l2-sel-proto">' + protoKeys.map(function (pk) { return '<option value="' + L.esc(pk) + '"' + (pk === protoKey ? " selected" : "") + ">" + L.esc(pk) + " (folds=" + analysis.protocols[pk].n_folds + ")</option>"; }).join("") + "</select>" +
      "    </div>" +
      "  </div>" +
      '  <div class="table-wrap"><table>' +
      '    <thead><tr><th>策略 / 选择器</th><th class="num">均路程</th><th class="num">相对 SBS 变化</th><th class="num">距 VBS</th><th class="num">p 值</th><th class="num">失误样本</th><th class="num">分离计时 (特征+推理+求解)</th><th>选出分布</th></tr></thead>' +
      "    <tbody>" + selRows + "</tbody>" +
      "  </table></div>" +
      '  <details class="source-box"><summary>展开最大遗憾失误样本（' + L.esc(decKey || "") + "，显示前 " + Math.min(30, mistakes.length) + " / 共 " + mistakes.length + " 例）</summary>" +
      '    <div class="table-wrap" style="margin-top:10px;max-height:360px;overflow-y:auto;"><table>' +
      '      <thead><tr><th>算例</th><th class="num">n</th><th>空间分布</th><th>选出算法 (Obj)</th><th>Oracle 最优 (Obj)</th><th class="num">选择遗憾</th><th>查看</th></tr></thead>' +
      "      <tbody>" + (mistakeRows || '<tr><td colspan="7" class="muted">当前协议下零失误样本</td></tr>') + "</tbody>" +
      "    </table></div>" +
      "  </details>" +
      "</div>";
  }

  window.WB_RESULTS_PARTS = {
    renderParetoSvg: renderParetoSvg,
    renderTierBreakdown: renderTierBreakdown,
    renderPublishedTrack: renderPublishedTrack,
    renderH003P0Spotlight: renderH003P0Spotlight,
    renderSelectionPanel: renderSelectionPanel
  };

  // Preserve compatibility for #page=results hashes by routing through unified benchmarks view.
  window.WB_VIEWS = window.WB_VIEWS || {};
  window.WB_VIEWS.results = {
    render: function (core, state, bundle) { return window.WB_VIEWS.benchmarks.render(core, state, bundle); },
    bind: function (el, core, state, nav, bundle) { return window.WB_VIEWS.benchmarks.bind(el, core, state, nav, bundle); }
  };
})();


/* === app.js === */
/* Main SPA Coordinator: Single-Row Topbar, Progressive View Routing, Offline Script Bundle Loader. */
(function () {
  "use strict";

  const PAGE_META = {
    overview: "总览",
    benchmarks: "基准对比",
    comparator: "路线对照",
    knowledge: "机理与知识库"
  };

  function parseHash() {
    const raw = (window.location.hash || "").replace(/^#/, "");
    const params = new URLSearchParams(raw);
    const rawPage = params.get("page") || "overview";
    const normPage = rawPage === "results" ? "benchmarks" : rawPage;
    return {
      page: PAGE_META[normPage] ? normPage : "overview",
      family: params.get("family") || "cvrp",
      suite: params.get("suite") || "",
      tab: params.get("tab") || "",
      scope: params.get("scope") || "",
      sortBy: params.get("sortBy") || "mean_rel_gap",
      sortDir: params.get("sortDir") || "asc",
      inst: params.get("inst") || "",
      algA: params.get("algA") || "",
      algB: params.get("algB") || "",
      preset: params.get("preset") || "",
      cmpFocus: params.get("cmpFocus") || "focus",
      showOpt: params.get("showOpt") === "1",
      stepIdx: params.get("stepIdx") !== null ? Number(params.get("stepIdx")) : -1,
      hlRoute: params.get("hlRoute") !== null ? Number(params.get("hlRoute")) : -1,
      story: params.get("story") || "h003",
      topic: params.get("topic") || "",
      entry: params.get("entry") || "",
      kbQuery: params.get("kbQuery") || "",
      kbFam: params.get("kbFam") || "",
      kbTier: params.get("kbTier") || "",
      kbMode: params.get("kbMode") || "",
      expandAll: params.get("expandAll") === "1",
      showAllPapers: params.get("showAllPapers") === "1",
      selAnalysis: params.get("selAnalysis") || "",
      selProto: params.get("selProto") || "",
      present: params.get("present") === "1",
      mlAlpha: params.get("mlAlpha") !== null ? Number(params.get("mlAlpha")) : 1.15,
      mlScale: params.get("mlScale") !== null ? Number(params.get("mlScale")) : 0.001,
      mlPress: params.get("mlPress") !== null ? Number(params.get("mlPress")) : 65
    };
  }

  function serializeHash(st) {
    const p = new URLSearchParams();
    p.set("page", st.page || "overview");
    if (st.family && st.family !== "cvrp") p.set("family", st.family);
    if (st.suite) p.set("suite", st.suite);
    if (st.tab) p.set("tab", st.tab);
    if (st.scope) p.set("scope", st.scope);
    if (st.sortBy && st.sortBy !== "mean_rel_gap") p.set("sortBy", st.sortBy);
    if (st.sortDir && st.sortDir !== "asc") p.set("sortDir", st.sortDir);
    if (st.inst) p.set("inst", st.inst);
    if (st.algA) p.set("algA", st.algA);
    if (st.algB) p.set("algB", st.algB);
    if (st.preset) p.set("preset", st.preset);
    if (st.cmpFocus && st.cmpFocus !== "focus") p.set("cmpFocus", st.cmpFocus);
    if (st.showOpt) p.set("showOpt", "1");
    if (st.stepIdx !== undefined && st.stepIdx >= 0) p.set("stepIdx", String(st.stepIdx));
    if (st.hlRoute !== undefined && st.hlRoute >= 0) p.set("hlRoute", String(st.hlRoute));
    if (st.story && st.story !== "h003") p.set("story", st.story);
    if (st.entry) p.set("entry", st.entry);
    if (st.kbQuery) p.set("kbQuery", st.kbQuery);
    if (st.kbFam) p.set("kbFam", st.kbFam);
    if (st.kbTier) p.set("kbTier", st.kbTier);
    if (st.kbMode) p.set("kbMode", st.kbMode);
    if (st.expandAll) p.set("expandAll", "1");
    if (st.showAllPapers) p.set("showAllPapers", "1");
    if (st.selAnalysis) p.set("selAnalysis", st.selAnalysis);
    if (st.selProto) p.set("selProto", st.selProto);
    if (st.present) p.set("present", "1");
    return "#" + p.toString();
  }

  let currentState = parseHash();
  const loadingBundles = {};

  function ensureSuiteBundle(suiteId, onReady) {
    window.__WB_SUITE_BUNDLES__ = window.__WB_SUITE_BUNDLES__ || {};
    if (!suiteId) { onReady(null); return; }
    if (window.__WB_SUITE_BUNDLES__[suiteId]) { onReady(window.__WB_SUITE_BUNDLES__[suiteId]); return; }
    if (loadingBundles[suiteId]) return;
    loadingBundles[suiteId] = true;
    const sc = document.createElement("script");
    sc.src = "./workbench_data/suite_" + encodeURIComponent(suiteId) + ".js";
    sc.onload = function () { loadingBundles[suiteId] = false; onReady(window.__WB_SUITE_BUNDLES__[suiteId] || null); };
    sc.onerror = function () { loadingBundles[suiteId] = false; onReady(null); };
    document.head.appendChild(sc);
  }

  function defaultSuiteForFamily(core, fam) {
    const preferred = { cvrp: "cvrp_ext_cvrplib_x_100", tsp: "tsp_ext_tsplib_euc2d", obp: "obp_ext_eoh_weibull" };
    if (preferred[fam] && window.WB_LABELS.getSuite(core, preferred[fam])) return preferred[fam];
    const match = (core.suites || []).find(function (s) { return s.problem_family === fam; });
    return (match && match.suite_id) || (core.suites[0] && core.suites[0].suite_id) || "";
  }

  function renderTopbar(core, state) {
    const L = window.WB_LABELS;
    const topEl = document.getElementById("app-topbar");
    const fam = state.family || "cvrp";
    const famBtns = ["cvrp", "tsp", "obp"].map(function (f) {
      return '<button type="button" class="' + (f === fam ? "active" : "") + '" data-family="' + f + '">' + L.esc(L.FAMILY_LABELS[f].short) + "</button>";
    }).join("");

    const navOrder = ["overview", "benchmarks", "comparator", "knowledge"];
    const navLinks = navOrder.map(function (p) {
      return '<button type="button" class="nav-link ' + (state.page === p ? "active" : "") + '" data-page="' + p + '">' + L.esc(PAGE_META[p]) + "</button>";
    }).join("");

    topEl.innerHTML = [
      '<div class="topbar-inner">',
      '  <div class="topbar-left">',
      '    <div class="brand">',
      '      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#165dff" stroke-width="1.9"><polygon points="12 2.5 20.5 7.5 20.5 16.5 12 21.5 3.5 16.5 3.5 7.5"/><circle cx="12" cy="12" r="2.2" fill="#165dff" stroke="none"/><line x1="12" y1="2.5" x2="12" y2="9.8"/><line x1="20.5" y1="16.5" x2="14" y2="13"/><line x1="3.5" y1="16.5" x2="10" y2="13"/></svg>',
      '      <span>OptBench · 组合优化研究工作台</span>',
      '    </div>',
      '    <div class="seg">' + famBtns + "</div>",
      "  </div>",
      '  <nav class="nav-tabs">' + navLinks + "</nav>",
      '  <div class="topbar-actions">',
      '    <span class="release-tag">' + L.esc(core.budget_ms) + " ms · " + L.esc(core.release_id || "") + "</span>",
      '    <button type="button" class="btn sm ' + (state.present ? "active" : "") + '" id="top-present-btn">' + (state.present ? "退出宽屏" : "宽屏") + "</button>",
      "  </div>",
      "</div>"
    ].join("\n");

    topEl.querySelectorAll("[data-family]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const nf = btn.getAttribute("data-family");
        navigate({ family: nf, suite: defaultSuiteForFamily(core, nf), inst: "", algA: "", algB: "", stepIdx: -1, hlRoute: -1 });
      });
    });
    topEl.querySelectorAll("[data-page]").forEach(function (btn) {
      btn.addEventListener("click", function () { navigate({ page: btn.getAttribute("data-page"), tab: "" }); });
    });
    const pBtn = topEl.querySelector("#top-present-btn");
    if (pBtn) pBtn.addEventListener("click", function () { navigate({ present: !state.present }); });
  }

  function bindGlobalNav(container) {
    container.querySelectorAll("[data-nav]").forEach(function (el) {
      if (el.__wbBoundNav) return;
      el.__wbBoundNav = true;
      el.addEventListener("click", function (ev) {
        ev.preventDefault();
        const p = new URLSearchParams(el.getAttribute("data-nav") || "");
        const patch = {};
        p.forEach(function (v, k) {
          if (v === "true") patch[k] = true;
          else if (v === "false") patch[k] = false;
          else patch[k] = v;
        });
        navigate(patch);
      });
    });
  }

  function renderApp() {
    const core = window.__WB_CORE__;
    const mainEl = document.getElementById("app-main");
    if (!core) {
      mainEl.innerHTML = '<div class="panel">未检测到 <code>workbench_data/core.js</code> 数据包。请确认通过完整打包输出目录打开。</div>';
      return;
    }

    if (!currentState.suite) currentState.suite = defaultSuiteForFamily(core, currentState.family);
    document.body.classList.toggle("presentation-mode", Boolean(currentState.present));

    renderTopbar(core, currentState);

    const page = currentState.page || "overview";
    const view = (window.WB_VIEWS && window.WB_VIEWS[page]) || window.WB_VIEWS.overview;
    const activeSuiteId = currentState.suite;
    const needsBundle = page === "benchmarks" || page === "comparator";

    if (needsBundle && activeSuiteId && !(window.__WB_SUITE_BUNDLES__ && window.__WB_SUITE_BUNDLES__[activeSuiteId])) {
      mainEl.innerHTML = view.render(core, currentState, null);
      bindGlobalNav(mainEl);
      if (view.bind) view.bind(mainEl, core, currentState, navigate, null);
      ensureSuiteBundle(activeSuiteId, function (bundle) {
        if (currentState.suite === activeSuiteId) {
          mainEl.innerHTML = view.render(core, currentState, bundle);
          bindGlobalNav(mainEl);
          if (view.bind) view.bind(mainEl, core, currentState, navigate, bundle);
        }
      });
      return;
    }

    const bundle = (window.__WB_SUITE_BUNDLES__ && activeSuiteId) ? window.__WB_SUITE_BUNDLES__[activeSuiteId] : null;
    mainEl.innerHTML = view.render(core, currentState, bundle);
    bindGlobalNav(mainEl);
    if (view.bind) view.bind(mainEl, core, currentState, navigate, bundle);
  }

  function navigate(patch, silentInPlace) {
    const cleanPatch = Object.assign({}, patch);
    if (cleanPatch.page === "results") cleanPatch.page = "benchmarks";
    if (cleanPatch.page && cleanPatch.page !== currentState.page) {
      if (cleanPatch.tab === undefined) cleanPatch.tab = "";
      if (cleanPatch.preset === undefined) cleanPatch.preset = "";
      if (cleanPatch.stepIdx === undefined) cleanPatch.stepIdx = -1;
      if (cleanPatch.hlRoute === undefined) cleanPatch.hlRoute = -1;
    }
    if (cleanPatch.suite && cleanPatch.suite !== currentState.suite && cleanPatch.inst === undefined) {
      cleanPatch.inst = "";
    }
    currentState = Object.assign({}, currentState, cleanPatch);
    if (!silentInPlace) {
      const nextHash = serializeHash(currentState);
      if (window.location.hash !== nextHash) window.history.replaceState(null, "", nextHash);
    }
    renderApp();
  }

  window.addEventListener("hashchange", function () { currentState = parseHash(); renderApp(); });
  document.addEventListener("DOMContentLoaded", renderApp);
  if (document.readyState !== "loading") renderApp();
})();

</script>
