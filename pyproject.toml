[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-loop"
version = "1.2.3"
description = "Run pinned official EoH with registered problem contracts and executable skills"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "PyYAML>=6.0"]
eoh = ["eoh @ git+https://github.com/FeiLiu36/EoH.git@472545785c936dcfc863d2bc0d6109cf23c7ce62#subdirectory=eoh"]

[tool.setuptools]
packages = [
    "agent_skill_loop", "agent_skill_loop.memory", "agent_skill_loop.problems",
    "agent_skill_loop.benchmark", "agent_skill_loop.evidence",
    "agent_skill_loop.cvrp_workbench", "agent_skill_loop.interface_design",
    "research_agent", "research_agent.tools",
    "eoh_frozen", "algorithm_optimization_skill", "benchmarks",
    "benchmarks.eohs_v1", "benchmarks.eohs_v1.manifests", "benchmarks.eohs_v1.expected",
    "benchmarks.cvrp_workbench", "experiments", "experiments.cvrp_midterm.selection_s2", "reports",
]

[tool.setuptools.package-dir]
algorithm_optimization_skill = "skills/algorithm-optimization"

[tool.setuptools.package-data]
"agent_skill_loop.problems" = ["data/*.json"]
algorithm_optimization_skill = ["SKILL.md", "agents/*.yaml", "references/*.md", "references/examples/*.md"]
benchmarks = ["eohs_v1/*.json", "eohs_v1/*.md", "eohs_v1/manifests/*.json", "eohs_v1/expected/*.json"]
"benchmarks.cvrp_workbench" = ["registry.json", "manifests/*.json", "published_results/*.json"]
experiments = [
    "cvrp_midterm/selection_s2/rules_s2/*.py",
    "cvrp_midterm/runs/s2_autonomous_math_r8/rounds/round_0004/eoh_run/skills/candidate_1/code.py",
    "island605_archive/rules/all/cvrp/*.py",
    "island605_archive/rules/all/tsp/*.py",
    "island605_archive/rules/all/bp/*.py",
]
"experiments.cvrp_midterm.selection_s2" = ["matrix_s2.json"]
reports = [
    "evidence/cvrp_p0_p1_p2_20261107/p0/frozen_code/*.py",
    "evidence/cvrp_p0_p1_p2_20261107/p1/V0.py",
    "evidence/cvrp_super_agent_reference_20261107/dev_suite.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/kernel", "tests/eoh_frozen", "tests/knowledge"]
