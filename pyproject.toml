[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-loop"
version = "0.1.0"
description = "Run pinned official EoH with registered problem contracts and executable skills"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]
eoh = ["eoh @ git+https://github.com/FeiLiu36/EoH.git@472545785c936dcfc863d2bc0d6109cf23c7ce62#subdirectory=eoh"]

[tool.setuptools.packages.find]
include = ["agent_skill_loop*", "eoh_frozen*"]

[tool.pytest.ini_options]
testpaths = ["tests/kernel", "tests/eoh_frozen"]
