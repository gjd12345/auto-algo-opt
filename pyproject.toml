[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-loop"
version = "0.1.0"
description = "Generate, evaluate, and persist executable CVRP heuristic skills"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["agent_skill_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests/kernel"]
