name: tests

on:
  push:
    branches: [main, agent-skill-loop-0908]
  pull_request:
    branches: [main, agent-skill-loop-0908]

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 11)"
      - name: Install kernel
        run: pip install -e ".[dev]"
      - name: Import kernel without eoh
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('eoh') is None"
          python -c "import agent_skill_loop.__main__, eoh_frozen.export; import sys; assert 'eoh' not in sys.modules; assert 'tests.fixtures.loop' not in sys.modules"
      - name: Run kernel tests
        run: python -m pytest tests/kernel -q

  eoh:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 11)"
      - name: Install kernel and pinned EoH extra
        run: pip install -e ".[dev,eoh]"
      - name: Require official EoH import
        run: python -c "import eoh, eoh_frozen.problem"
      - name: Run adapter tests
        env:
          EOH_REQUIRED: "1"
        run: python -m pytest tests/eoh_frozen -q

  windows-kernel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel
        run: python -m pip install -e ".[dev]"
      - name: Run kernel tests
        run: python -m pytest tests/kernel -q
