name: tests

on:
  push:
    branches: [main, Refactor0830, agent-skill-loop-0908]
  pull_request:
    branches: [main, Refactor0830]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 11)"
      - name: Install package (with test deps)
        run: pip install -e ".[dev]"
      - name: Import kernel
        run: python -c "import agent_skill_loop"
      - name: Run kernel tests
        run: python -m pytest tests/kernel -q
