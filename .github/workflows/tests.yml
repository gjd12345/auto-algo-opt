name: tests

on:
  push:
    branches: [main, agent-skill-loop-0908]
  pull_request:
    branches: [main, agent-skill-loop-0908]

jobs:
  knowledge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/knowledge -q
      - run: python -m knowledge_tools validate-release --release knowledge_store/releases/20260914-main-d6433549-kb-v0

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 11)"
      - name: Install kernel
        run: pip install -e ".[dev]"
      - name: Import kernel without eoh
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('eoh') is None"
          python -c "import agent_skill_loop.__main__, eoh_frozen.export; import sys; assert 'eoh' not in sys.modules; assert not any(name.startswith('tests.fixtures') for name in sys.modules)"
      - name: Validate Coding Agent Skill
        run: python tools/validate_skill.py skills/algorithm-optimization
      - name: Run kernel tests
        run: python -m pytest tests/kernel -q
      - name: Verify wheel outside checkout
        run: python tools/verify_release_install.py

  eoh:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 11)"
      - name: Install kernel and pinned EoH extra
        run: pip install -e ".[dev,eoh]"
      - name: Require official EoH import
        run: python -c "import eoh, eoh_frozen.problem"
      - name: Run adapter tests
        env:
          EOH_REQUIRED: "1"
        run: python -m pytest tests/eoh_frozen -q
      - name: Two-round population seed and heldout closure (localhost fixture)
        run: python tools/verify_benchmark_closure.py --output outputs/ci-benchmark-closure
      - name: Export compact Session evidence
        run: python tools/export_benchmark_evidence.py --run outputs/ci-benchmark-closure/session --report-dir outputs/ci-benchmark-closure --output outputs/ci-benchmark-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-closure-${{ matrix.os }}
          path: |
            outputs/ci-benchmark-evidence/
            outputs/ci-benchmark-closure/*.json

  windows-kernel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel
        run: python -m pip install -e ".[dev]"
      - name: Run kernel tests
        run: python -m pytest tests/kernel -q
